[package]
name         = "stable-view"
authors      = ["Finley Huggins"]
description  = "Get views whose `'stable` lifetimes remain valid when the views' source data is moved"
readme       = "README.md"
keywords     = ["stable", "aliasable", "lifetime", "reference", "covariance"]
categories   = ["rust-patterns", "memory-management", "no-std", "no-std::no-alloc"]
include      = ["Cargo.toml", "src/**/*.rs", "LICENSE-APACHE", "LICENSE-MIT", "README.md"]
version      = "0.1.0"
edition      .workspace = true
rust-version .workspace = true
repository   .workspace = true
license      .workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true


[dependencies]
variance-family = { workspace = true, default-features = false }
either          = { workspace = true, default-features = false, optional = true }

[features]
default     = ["std"]

std         = ["alloc", "variance-family/std"]
alloc       = ["variance-family/alloc"]

more-impls  = ["variance-family/more-impls"]
either      = ["dep:either", "variance-family/either"]
